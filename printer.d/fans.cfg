#   Fans, only fans

# part cooling fan
[fan]
#	Top 5015 blower fan on StealthBurner
pin: EBBCan:gpio13

[heater_fan hotend_fan]
#	Bottom 4010 axial fan on StealthBurner
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0

[fan_generic nevermore]
#	Nevermore recirculating filter, controlled by PRINT_START/PRINT_END macros
pin: PF8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.10

[fan_generic bed_fan]
#	Four 5015 blower fans under the bed, doubles as active chamber heating
pin: PA4
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5

[controller_fan controller_fan_1]
#	4010 axial fan on the right skirt
pin: PF7
max_power: 1.0
kick_start_time: 0.5
fan_speed: 0.66

[controller_fan controller_fan_2]
#	Second 4010 axial fan on the right skirt
pin: PF9
max_power: 1.0
kick_start_time: 0.5
fan_speed: 0.66

[fan_generic exhaust_fan]
#	4010 axial fan with pre-filter and activated carbon filter
pin: PF6
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5