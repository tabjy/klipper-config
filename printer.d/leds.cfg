#   LEDs

[neopixel toolhead_light]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW

[output_pin caselight]
#Chamber Lighting
pin: PA5
pwm:true
shutdown_value: 0
cycle_time: 0.001
hardware_pwm: true

[neopixel my_led_strip]
pin: PD15               # Replace with your MCU's data pin (e.g., PA4, PC13)
chain_count: 14         # Set this to the total number of LEDs or pixels in your chain
color_order: RGB        # Adjust to RGB or GRB depending on your WS2811 variant
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1