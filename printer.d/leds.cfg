#   LEDs

[neopixel toolhead_light]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_WHITE: 1

[output_pin caselight]
# Front chamber lighting
pin: PA5
pwm:true
shutdown_value: 0
cycle_time: 0.001
hardware_pwm: true

[neopixel RGB_strip]
# Side chamber lighting
pin: PD15
chain_count: 14
color_order: RGB
initial_RED: 1
initial_GREEN: 0.75
initial_BLUE: 0.6

[led_effect heating]
leds: neopixel:RGB_strip
heater: heater_bed
frame_rate: 24
layers:
    heaterfire 1 0 top (1,0,0),(1,.5,0),(1,1,0)

[led_effect done]
leds: neopixel:RGB_strip
frame_rate: 24
layers:
    blink .6 .5 top (0,1,0)

[led_effect error]
leds: neopixel:RGB_strip
frame_rate: 24
layers:
    strobe 2 1.5 top (1,0,0)