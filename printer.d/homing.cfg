#   Homing, gantry leveling and idle behavior

[idle_timeout]
timeout: 3300

[safe_z_home]
home_xy_position: 175,175
speed: 100
z_hop: 10

#   NOTE: Klipper's quad_gantry_level maps probe points to stepper names:
#       z = front-left, z1 = rear-left, z2 = rear-right, z3 = front-right
#   If QGL ever aborts with "Possibly Z motor numbering is wrong",
#   identify each motor with STEPPER_BUZZ STEPPER=stepper_z (and _z1/_z2/_z3)
#   and reassign the pins in printer.d/motion.cfg - no rewiring needed.
[quad_gantry_level]
##	Min/Max gantry corners - measure from the nozzle at MIN (0,0) and MAX (350,350)
##	to the respective belt positions

gantry_corners:
	-60,-10
	410,420
points:
	100,25
	100,325
	250,325
	250,25

speed: 300
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.0075
max_adjust: 10