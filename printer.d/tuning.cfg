#   Input shaping and motor auto-tuning

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
accel_chip: adxl345
probe_points: 175, 175, 20  # Center of the 350mm bed

[input_shaper]
# Tuned values (x: 2hump_ei @ 76.6 Hz, y: mzv @ 37.8 Hz) are managed
# by SHAPER_CALIBRATE and stored in the SAVE_CONFIG block in printer.cfg -
# run SHAPER_CALIBRATE to re-tune.

# NEMA 14 pancake motor used on the extruder.
# Many vendors call this motor cse14ra1l410a but the h in the part number is 
# correct.
[motor_constants moons-cse14hra1l410a]
resistance: 1.9
inductance: 0.00141
holding_torque: 0.1
max_current: 1.0
steps_per_revolution: 200

# NEMA 17 motor used on the X, Y, and Z axes.
[motor_constants moons-ms17hd6p420i]
resistance: 1.3
inductance: 0.0027
holding_torque: 0.67
max_current: 2.0
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_y]
motor: moons-ms17hd6p420i

[autotune_tmc stepper_z]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z1]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z2]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z3]
motor: moons-ms17hd6p420i

# Autotune_tmc on extruder causes overheating of the motor and/or tmc2209 in a
# heated chamber. Also Autotune_tmc uses StealthChop with the extruder, which I
# disagree with.
# [autotune_tmc extruder]
# motor: moons-cse14hra1l410a