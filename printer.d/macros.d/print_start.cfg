#   PRINT_START - slicer start script
#   Required: EXTRUDER=<nozzle temp>  (alias: EXTRUDER_TEMP)
#   Optional: PROBE= BED= CHAMBER=    (default 0, 0, 0; alias: BED_TEMP)
#   Delegates homing/leveling/mesh to G32, then heats the nozzle for print.

[gcode_macro PRINT_START]
description: Level gantry via G32 and heat nozzle for print start
gcode:
    {% set EXTRUDER = params.EXTRUDER|default(params.EXTRUDER_TEMP|default(none)) %}
    {% if EXTRUDER is none %}
        { action_raise_error('PRINT_START: EXTRUDER=<temp> is required') }
    {% endif %}
    
    {% set EXTRUDER = EXTRUDER|float %}
    {% set PROBE = params.PROBE|default(0)|float %}
    {% set BED = params.BED|default(params.BED_TEMP|default(0))|float %}
    {% set CHAMBER = params.CHAMBER|default(0)|float %}

    G32 PROBE={PROBE} BED={BED} CHAMBER={CHAMBER}

    {% if EXTRUDER > 0 %}
    M109 S{EXTRUDER}                 ; heat nozzle to print temperature
    {% endif %}
