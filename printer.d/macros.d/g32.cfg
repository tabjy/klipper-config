#   G32 - home, level gantry and calibrate bed mesh
#   Optional params: PROBE= BED= CHAMBER= (all default 0)
#     PROBE   - nozzle temp to reach before probing (capped at 150C)
#     BED     - bed temp to reach before quad gantry leveling (thermal expansion)
#     CHAMBER - placeholder, no chamber hardware wired up yet

[gcode_macro G32]
description: Home, level gantry and calibrate bed mesh
gcode:
    {% set PROBE = [params.PROBE|default(0)|float, 150]|min %}
    {% set BED = params.BED|default(0)|float %}
    {% set CHAMBER = params.CHAMBER|default(0)|float %}

    G28 X Y
    G0  X340 Y340 F7200               ; park and wait for heaters

    {% if BED > 0 %}
        M140 S{BED}                   ; start bed heating now
    {% endif %}
    
    {% if PROBE > 0 %}
        M109 S{PROBE}                 ; wait nozzle at probing temp
    {% endif %}

    {% if BED > 0 %}
        M190 S{BED}                   ; wait bed AT TEMP before QGL (thermal expansion)
    {% endif %}

    {% if CHAMBER > 0 %}
        # TODO: implement chamber temp monitoring and control. 
        #       Bed and bed fans are the only chamber heating we have right now.
        { action_respond_info('NOOP: CHAMBER=%.0f requested - chamber control not implemented yet' % CHAMBER) }
    {% endif %}

    G28 Z                            ; home all axes
    
    BED_MESH_CLEAR                   ; QGL will throw off the mesh, so clear it first
    QUAD_GANTRY_LEVEL
    BED_MESH_CALIBRATE

    G0 X175 Y175 Z30 F7200           ; park at bed center
