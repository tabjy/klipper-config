[gcode_shell_command beep]
command: env AUDIODEV=plughw:1,0 play
timeout: 10.
verbose: False

[gcode_macro M300]
description: Beep (HDMI audio polyfill)
gcode:
    {% set s = params.S|default(880)|float %}
    {% set ms = params.P|default(500)|float %}
    {% set p = ms / 1000.0 %}
    {% set v = params.V|default(1)|float %}
    {% if s < 1 or ms < 1 %}
        G4 P{ms}
    {% else %}
        # delay with slient padding to wait for amp powering up
        RUN_SHELL_COMMAND CMD=beep PARAMS="-q -n synth {p} sine {s} vol {v} delay 1"
    {% endif %}
